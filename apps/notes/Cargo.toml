[package]
name = "notes"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "notes-desktop"
path = "src/main.rs"

[dependencies]
heartnet-kit = { path = "../../crates/heartnet-kit" }
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
log = "0.4.34"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6.1", features = ["native-activity"] }
android_logger = "0.15.1"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "android-native-activity"] }
